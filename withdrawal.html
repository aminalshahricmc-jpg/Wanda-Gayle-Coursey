<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdrawal</title>

<style>
body{
  background:#001a33;
  color:gold;
  font-family:'Poppins',sans-serif;
  text-align:center;
  padding:40px;
}
h1{color:#00ff99;margin-bottom:25px;}

select,input{
  width:80%;
  max-width:380px;
  padding:12px;
  margin:12px 0;
  border-radius:8px;
  border:1px solid gold;
  background:#111;
  color:gold;
  font-size:16px;
}

.amount{
  font-size:26px;
  font-weight:bold;
  margin:20px 0;
  color:#00ff99;
}

.btn{
  background:linear-gradient(90deg,gold,#00ff99);
  color:#000;
  border:none;
  padding:14px 32px;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
  transition:.3s;
}
.btn:hover{transform:scale(1.05);}

.back{
  display:block;
  margin-top:25px;
  color:#aaa;
  text-decoration:none;
}
.back:hover{color:gold}

/* Popup */
.popup-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.popup-box{
  background:#111;
  border:1px solid gold;
  border-radius:18px;
  padding:30px;
  width:85%;
  max-width:420px;
  box-shadow:0 0 30px rgba(255,215,0,.25);
  animation:popup .35s ease;
}
@keyframes popup{
  from{transform:scale(.85);opacity:0}
  to{transform:scale(1);opacity:1}
}
.popup-box h2{
  color:#00ff99;
  margin-bottom:12px;
}
.popup-box p{
  color:#fff;
  line-height:1.6em;
  margin-bottom:22px;
}
.popup-btn{
  background:linear-gradient(90deg,gold,#00ff99);
  border:none;
  padding:12px 30px;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Withdraw Bonus</h1>

<select id="method" onchange="updatePlaceholder()">
  <option value="">Select Method</option>
  <option value="cashapp">Cash App</option>
  <option value="paypal">PayPal</option>
</select>

<input type="text" id="account" placeholder="Enter details">

<div class="amount" id="withdrawAmount">$10,000</div>

<button class="btn" onclick="withdraw()">Withdraw</button>

<a href="index.html" class="back">⬅ Back</a>

<div class="popup-overlay" id="popup">
  <div class="popup-box">
    <h2>Withdrawal Successful</h2>
    <p>
      Your withdrawal has been successfully sent to your account.<br><br>
      <strong>$10,000 bonus balance is now $0.</strong>
    </p>
    <button class="popup-btn" onclick="finish()">OK</button>
  </div>
</div>

<script>
function updatePlaceholder(){
  const m = document.getElementById("method").value;
  const a = document.getElementById("account");
  if(m === "cashapp"){
    a.placeholder = "Enter Cash App tag (e.g. $username)";
  }else if(m === "paypal"){
    a.placeholder = "Enter PayPal email address";
  }else{
    a.placeholder = "Enter details";
  }
}

function withdraw(){
  const method = document.getElementById("method").value;
  const account = document.getElementById("account").value;
  if(method === "" || account === ""){
    alert("Please select a method and enter your details.");
    return;
  }
  document.getElementById("popup").style.display = "flex";
}

function finish(){
  localStorage.setItem("bonusBalance","0");
  document.getElementById("popup").style.display = "none";
  window.location.href = "index.html";
}
</script>

</body>
  </html>
